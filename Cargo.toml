[package]
name = "fast-sync"
version = "0.0.3"
edition = "2024"
description = "A client for the WiFi File Transfer HTTP protocol"
homepage = "https://github.com/Gordon01/fast-sync"
documentation = "https://docs.rs/fast-sync"
repository = "https://github.com/Gordon01/fast-sync"
keywords = ["android", "file-transfer", "wifi"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
readable = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
