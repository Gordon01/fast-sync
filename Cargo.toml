[workspace]
members = ["src/*"]
resolver = "3"

[workspace.package]
version = "0.0.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18.6"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
wft = { path = "src/wft" }
readable = "0.16"
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "http2",
  "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
widestring = "1"
