[package]
name = "wft"
version = "0.0.4"
edition.workspace = true
license.workspace = true
description = "A client for the WiFi File Transfer HTTP protocol"
homepage = "https://github.com/Gordon01/fast-sync"
documentation = "https://docs.rs/wft"
repository = "https://github.com/Gordon01/fast-sync"
keywords = ["android", "file-transfer", "wifi"]
categories = ["network-programming"]

[dependencies]
readable.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
